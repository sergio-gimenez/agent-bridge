# Docs site, published to GitHub Pages by .github/workflows/docs.yml.
# Build locally with `make docs` or preview with `make docs-serve`.
#
# docs_dir is a staging tree, not docs/: scripts/build-docs.sh copies docs/
# there and adds README.md as index.md with its links rewritten.

[project]
site_name = "AgentBridge"
site_description = "Your sessions and shared agent setup, in one place."
site_url = "https://agentbridge.sergiogimenez.com/"
repo_url = "https://github.com/sergio-gimenez/agent-bridge"
repo_name = "sergio-gimenez/agent-bridge"
edit_uri = "edit/main/docs/"
docs_dir = ".site-src"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Demos" = "demos.md" },
  { "Guides" = [
    { "Forks and handoffs" = "forking.md" },
    { "Push and pull" = "push-pull.md" },
    { "Switching agents in Herdr" = "herdr.md" },
    { "Share skills and MCPs" = "setup.md" },
    { "Multiple Claude Code accounts" = "multiple-claude-accounts.md" },
    { "Multiple Codex accounts" = "multiple-codex-accounts.md" },
    { "Memory and diagrams across tools" = "integrations.md" },
    { "Configuration and internals" = "reference.md" },
  ] },
  { "Design" = [
    { "Shared agent setup" = "shared-agent-setup.md" },
  ] },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.action.view",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
