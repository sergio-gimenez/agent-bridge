# Docs site, published to GitHub Pages by .github/workflows/docs.yml.
# Build locally with `make docs` or preview with `make docs-serve`.
#
# docs_dir is a staging tree, not docs/: scripts/build-docs.sh copies docs/
# there and rewrites links that point at repo files outside docs/.

[project]
site_name = "AgentBridge"
site_description = "Every coding-agent session you have, in one list: Claude Code, Codex, OpenCode and Antigravity."
site_url = "https://agentbridge.sergiogimenez.com/"
repo_url = "https://github.com/sergio-gimenez/agent-bridge"
repo_name = "sergio-gimenez/agent-bridge"
edit_uri = "edit/main/docs/"
docs_dir = ".site-src"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Install" = "getting-started/install.md" },
    { "Using the picker" = "getting-started/picker.md" },
    { "Demos" = "demos.md" },
  ] },
  { "Agents" = [
    { "Overview" = "agents/index.md" },
    { "Claude Code" = "agents/claude-code.md" },
    { "Codex" = "agents/codex.md" },
    { "OpenCode" = "agents/opencode.md" },
    { "Antigravity" = "agents/antigravity.md" },
  ] },
  { "Guides" = [
    { "Forks and handoffs" = "forking.md" },
    { "Push and pull" = "push-pull.md" },
    { "Secret conversations" = "secret.md" },
    { "Switching agents in Herdr" = "herdr.md" },
  ] },
  { "Extend" = [
    { "Share skills and MCPs" = "setup.md" },
    { "Memory and diagrams across tools" = "integrations.md" },
    { "Scripting agb" = "extend/scripting.md" },
    { "Adding an agent" = "extend/adding-an-agent.md" },
  ] },
  { "Reference" = [
    { "Configuration and internals" = "reference.md" },
    { "Design: shared agent setup" = "shared-agent-setup.md" },
    { "The headroom experiment" = "headroom-experiment.md" },
  ] },
]

extra_css = ["assets/extra.css"]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.action.view",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
