name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.23", "stable"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Vet and format
        run: make vet

      - name: Test
        run: go test -race ./...

      - name: Build
        run: make build

  demo-fixture:
    name: Demo fixture builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The recorded demo is only reproducible if the synthetic fixture still
      # builds and the picker can list it end to end.
      - name: Build fixture and list sessions
        run: |
          make build demo-fixture
          HOME="$PWD/demo/.fixture/home" AGB_DRY_RUN=1 ./bin/agb --print
